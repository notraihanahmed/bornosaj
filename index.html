<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bornd साज Website</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">
                <img src="logo.png" alt="Logo">
            </a>

            <div class="nav-links-container">
                <ul class="nav-links">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Courses</a></li>
                    <li><a href="#">Projects</a></li>
                    <li><a href="#">Pricing</a></li>
                    <li><a href="#">Products</a></li>
                </ul>
                <a href="#" class="btn-contact">Contact</a>
                <button id="search-btn" class="search-icon-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>
        </div>
        <div class="search-box-container" id="search-box-container">
            <input type="text" placeholder="Search here..." class="search-input">
        </div>
    </nav>

    <header class="hero-section">
        <div class="hero-overlay-box">
            <h1>মনের রঙে বর্ণ সাজুক</h1>
            <a href="#" class="btn-hero">See our courses ></a>
        </div>
    </header>

    <section class="feature-box-container">
        <div class="feature-box">
            <div class="feature-image">
                <img src="opening.png" alt="Opening Announcement">
            </div>
            <div class="feature-text">
                <h2>বর্ণসাজ ক্যালিগ্রাফি একাডেমী (২য় ব্রাঞ্চ)</h2>
                <p class="highlight-text">প্রথম ক্লাস সকলের জন্য উন্মুক্ত</p>
            </div>
        </div>
    </section>

    <section class="main-content">
        <div class="content-card"></div>
        <div class="content-card"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
